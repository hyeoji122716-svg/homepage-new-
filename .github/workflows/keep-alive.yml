name: Supabase keep-alive

# 10분마다 keep-alive 엔드포인트를 호출해 Supabase 무료 프로젝트의
# 자동 일시정지(7일 무활동)를 방지한다.
# Vercel 무료 플랜의 Cron 은 하루 1회로 제한되므로, 잦은 주기는 여기서 트리거한다.
on:
  schedule:
    - cron: "*/10 * * * *" # 10분마다 (UTC 기준, GitHub Actions는 다소 지연될 수 있음)
  workflow_dispatch: {} # 수동 실행 버튼

# 동시에 여러 번 돌지 않도록: 새 실행이 뜨면 진행 중인 것은 취소
concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call keep-alive endpoint
        env:
          KEEP_ALIVE_URL: https://www.connectu.co.kr/api/cron/keep-alive
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET 시크릿이 설정되지 않았습니다. (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          # -f: HTTP 4xx/5xx면 실패 처리 / --retry: 일시 오류 재시도
          curl -sS -f --retry 3 --retry-delay 5 --max-time 30 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "$KEEP_ALIVE_URL"
